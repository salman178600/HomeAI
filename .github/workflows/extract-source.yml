name: Extract source ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf source
          mkdir source
          unzip -q "business-ai-agent-Vercel-fixed-v3-google-verified.zip" -d source

      - name: Find Customize
        run: |
          grep -RniE --include='*.tsx' --include='*.jsx' --include='*.ts' --include='*.js' "Customize" source > CUSTOMIZE_LOCATION.txt || true

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source CUSTOMIZE_LOCATION.txt
          git commit -m "Extract website source" || exit 0
          git push
